name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'PKM100/mug'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build replay demo
        working-directory: frontend
        env:
          VITE_STATIC: '1'
        run: |
          npm ci
          npx tsc -b
          npx vite build --base="${{ steps.pages.outputs.base_path }}/demo/" --outDir ../_site/demo
      - name: Add landing page
        run: cp site/index.html paper_demo/figs/ui.png _site/
      - uses: actions/upload-pages-artifact@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
